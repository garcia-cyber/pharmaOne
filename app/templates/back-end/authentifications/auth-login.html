<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport" />
  <title>Pharma | Connexion</title>

  <!-- General CSS Files -->
  <link rel="stylesheet" href="{% static 'back-end/assets/css/app.min.css' %}" />
  <link rel="stylesheet" href="{% static 'back-end/assets/bundles/bootstrap-social/bootstrap-social.css' %}" />
  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'back-end/assets/css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'back-end/assets/css/components.css' %}" />
  <!-- Custom style CSS -->
  <link rel="stylesheet" href="{% static 'back-end/assets/css/custom.css' %}" />
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'back-end/assets/img/favicon.ico' %}" />

  <style>
    :root {
      --primary: #1e293b;
      --primary-dark: #0f172a;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      --text-muted: #64748b;
      --text-dark: #0f172a;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
    }

    body {
      background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.5),
          rgba(0, 0, 0, 0.5),
          rgba(0, 0, 0, 0.5)
        ),
        url("{% static 'back-end/gemini/gemini2.jpg' %}") center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      border: 1px solid rgba(30, 41, 59, 0.15);
    }

    .login-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      color: #ffffff;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: #ffffff;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
    }

    .login-logo svg {
      width: 36px;
      height: 36px;
      color: var(--primary);
    }

    .login-header h4 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .login-header p {
      margin: 0.5rem 0 0;
      font-size: 0.875rem;
      opacity: 0.95;
    }

    .login-body {
      padding: 2rem 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.625rem;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.875rem;
    }

    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background: var(--input-bg);
      color: var(--text-dark);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30, 41, 59, 0.12);
      background: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }

    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .custom-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 14px -3px rgba(30, 41, 59, 0.35);
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(30, 41, 59, 0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .login-wrapper {
        padding: 1rem;
      }

      .login-header {
        padding: 1.5rem 1rem 1rem;
      }

      .login-body {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="loader"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <!-- Icône pharmacie -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 3v18" />
          </svg>
        </div>
        <h4>Pharma</h4>
        <p>Connectez-vous à votre espace</p>
      </div>

      <div class="login-body">
        <form method="POST" action="#" class="needs-validation" novalidate>
          {% csrf_token %}

          <div class="form-group">
            <label for="email">Adresse email</label>
            <input id="email" type="email" class="form-control" name="email" tabindex="1" required autofocus placeholder="exemple@pharma.com" />
            <div class="invalid-feedback">Veuillez entrer votre email</div>
          </div>

          <div class="form-group">
            <div class="form-options">
              <label for="password" class="control-label">Mot de passe</label>
              <a href="auth-forgot-password.html" class="forgot-link">Mot de passe oublié ?</a>
            </div>
            <input id="password" type="password" class="form-control" name="password" tabindex="2" required placeholder="••••••••" />
            <div class="invalid-feedback">Veuillez entrer votre mot de passe</div>
          </div>

          <div class="form-options">
            <div class="custom-checkbox">
              <input type="checkbox" name="remember" class="custom-control-input" tabindex="3" id="remember-me" />
              <label class="custom-control-label" for="remember-me">Se souvenir de moi</label>
            </div>
          </div>

          <div class="form-group">
            <button type="submit" class="btn-login" tabindex="4">
              Se connecter
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- General JS Scripts -->
  <script src="{% static 'back-end/assets/js/app.min.js' %}"></script>
  <!-- Page Specific JS File -->
  <script src="{% static 'back-end/assets/js/scripts.js' %}"></script>
  <!-- Custom JS File -->
  <script src="{% static 'back-end/assets/js/custom.js' %}"></script>
</body>
</html>
